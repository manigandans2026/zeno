<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="shell-type" content="mobile_tab"/>
  <title>Zuno — The New Standard in Connection</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          "colors": {
            "background": "#F8FAFC",
            "surface": "#FFFFFF",
            "surface-container-lowest": "#FFFFFF",
            "surface-container-low": "#F8FAFC",
            "surface-container": "#F1F5F9",
            "surface-container-high": "#E2E8F0",
            "surface-container-highest": "#CBD5E1",
            "primary": "#f43f5e",
            "primary-container": "#ec4899",
            "primary-fixed": "#fce7f3",
            "primary-fixed-dim": "#f472b6",
            "on-primary": "#ffffff",
            "on-primary-container": "#ffffff",
            "secondary": "#06b6d4",
            "secondary-container": "#0284c7",
            "secondary-fixed": "#cffafe",
            "secondary-fixed-dim": "#38bdf8",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#083344",
            "tertiary": "#0ea5e9",
            "tertiary-container": "#3b82f6",
            "tertiary-fixed": "#e0f2fe",
            "on-surface": "#0F172A",
            "on-surface-variant": "#64748B",
            "outline": "#CBD5E1",
            "outline-variant": "#E2E8F0",
            "error": "#ef4444"
          },
          "borderRadius": {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "2xl": "1.25rem",
            "full": "9999px"
          },
          "spacing": {
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "gutter-desktop": "1.5rem",
            "space-xs": "0.25rem",
            "space-md": "1rem",
            "gutter": "1rem",
            "margin": "1.25rem",
            "space-xl": "2.5rem",
            "margin-desktop": "3rem"
          },
          "fontFamily": {
            "body-lg": ["Plus Jakarta Sans"],
            "display-lg-mobile": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "label-lg": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"],
            "display-lg": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"]
          },
          "fontSize": {
            "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
            "label-sm": ["10px", {"lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700"}],
            "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
            "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
            "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700"}],
            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.015em", "fontWeight": "700"}]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #F8FAFC;
        color: #1E293B;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      body {
        overscroll-behavior: none;
        min-height: max(884px, 100dvh);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    
    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 20px; }
    }
    .animate-wave-1 { animation: wave 1.2s ease-in-out infinite; }
    .animate-wave-2 { animation: wave 1.2s ease-in-out infinite 0.2s; }
    .animate-wave-3 { animation: wave 1.2s ease-in-out infinite 0.4s; }
    .animate-wave-4 { animation: wave 1.2s ease-in-out infinite 0.1s; }
    .animate-wave-5 { animation: wave 1.2s ease-in-out infinite 0.3s; }
  </style>
</head>
<body class="bg-[#F8FAFC] font-body-md text-slate-800 antialiased selection:bg-pink-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
